name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg for the end-to-end test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  android:
    # Builds the Android TV / Fire TV debug APK and keeps it as an artifact.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu runner image ships the Android SDK with ANDROID_HOME set;
      # android-actions/setup-android is not needed and its "tools" install
      # fails since Google removed that package.
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opendvr-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  image:
    # Builds the container (no push) so Dockerfile breakage is caught on every branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BuildKit and the base images come through Google's Docker Hub mirror:
      # anonymous pulls from Docker Hub on shared runners time out or hit
      # rate limits. A miss on the mirror falls back to Docker Hub.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
